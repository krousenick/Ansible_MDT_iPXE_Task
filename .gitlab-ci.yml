stages:
  - lint
  - deploy

variables:
  DEPLOY_PATH: "F:/wwwroot"

ipxe-lint:
  stage: lint
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends > /dev/null 2>&1
  script:
    - |
      echo "=== Linting iPXE Scripts ==="
      FAILED=0
      for ipxe_file in *.ipxe; do
        if [ -f "$ipxe_file" ]; then
          echo "Linting: $ipxe_file"
          if ! head -1 "$ipxe_file" | grep -q '^#!ipxe'; then
            echo "  ERROR: Missing #!ipxe shebang"
            FAILED=1
          fi
          LABEL_COUNT=$(grep -c '^:' "$ipxe_file" || true)
          if [ "$LABEL_COUNT" -eq 0 ]; then
            echo "  WARNING: No labels found in $ipxe_file"
          fi
          if ! grep -q 'menu ' "$ipxe_file"; then
            echo "  WARNING: No menu definition found"
          fi
          if ! grep -q 'choose ' "$ipxe_file"; then
            echo "  WARNING: No menu selection (choose) found"
          fi
          if ! grep -q 'goto ' "$ipxe_file"; then
            echo "  WARNING: No goto statements found"
          fi
          echo "  PASS: $ipxe_file"
        fi
      done
      if [ $FAILED -ne 0 ]; then
        echo "=== iPXE Linting FAILED ==="
        exit 1
      fi
      echo "=== All iPXE files passed ==="
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

kickstart-lint:
  stage: lint
  image: fedora:latest
  before_script:
    - dnf install -y pykickstart > /dev/null 2>&1
  script:
    - |
      echo "=== Linting Kickstart Files ==="
      FAILED=0
      for ks_file in kickstart/*.ks; do
        if [ -f "$ks_file" ]; then
          echo "Validating: $ks_file"
          if ksvalidator "$ks_file"; then
            echo "  PASS: $ks_file"
          else
            echo "  FAIL: $ks_file validation failed"
            FAILED=1
          fi
        fi
      done
      if [ $FAILED -ne 0 ]; then
        echo "=== Kickstart Linting FAILED ==="
        exit 1
      fi
      echo "=== All kickstart files passed ==="
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

deploy-staging:
  stage: deploy
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache openssh-client gettext
    - |
      cat > /tmp/hash_passwords.py << 'ENDOFPYTHON'
      import crypt
      import secrets
      import os
      import sys

      def hash_password(password):
          salt = secrets.token_hex(8)
          return crypt.crypt(password, crypt.mksalt(crypt.METHOD_SHA512, salt=salt.encode()))

      if os.environ.get('ADMIN_PASSWORD_PLAINTEXT'):
          hashed = hash_password(os.environ['ADMIN_PASSWORD_PLAINTEXT'])
          with open('/tmp/admin_pass.env', 'w') as f:
              f.write(f'ADMIN_PASSWORD_HASHED={hashed}\n')
      
      if os.environ.get('GRUB_PASSWORD_PLAINTEXT'):
          hashed = hash_password(os.environ['GRUB_PASSWORD_PLAINTEXT'])
          with open('/tmp/grub_pass.env', 'w') as f:
              f.write(f'GRUB_PASSWORD_HASHED={hashed}\n')
      ENDOFPYTHON
  script:
    - |
      echo "=== Deploying to Staging IIS Server ==="
      
      if [ -z "$STAGING_SSH_HOST" ] || [ -z "$STAGING_SSH_USER" ]; then
        echo "ERROR: Staging SSH credentials not configured"
        exit 1
      fi
      
      if [ -n "$STAGING_SSH_KEY" ]; then
        mkdir -p ~/.ssh
        echo "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        echo "Host staging
          HostName $STAGING_SSH_HOST
          User $STAGING_SSH_USER
          IdentityFile ~/.ssh/id_ed25519
          StrictHostKeyChecking accept-new" > ~/.ssh/config
      fi
      
      echo "Deploying iPXE scripts..."
      scp -o StrictHostKeyChecking=no -r *.ipxe "$STAGING_SSH_USER@$STAGING_SSH_HOST:$DEPLOY_PATH/"
      
      echo "Processing password variables..."
      python3 /tmp/hash_passwords.py
      
      source /tmp/admin_pass.env 2>/dev/null || true
      source /tmp/grub_pass.env 2>/dev/null || true
      
      export ADMIN_PASSWORD_HASHED
      export GRUB_PASSWORD_HASHED
      
      echo "Substituting variables in kickstart files..."
      mkdir -p kickstart-processed
      for ks_file in kickstart/*.ks; do
        if [ -f "$ks_file" ]; then
          basename_ks=$(basename "$ks_file")
          envsubst < "$ks_file" > "kickstart-processed/$basename_ks"
        fi
      done
      
      echo "Deploying kickstart files..."
      scp -o StrictHostKeyChecking=no -r kickstart-processed/ "$STAGING_SSH_USER@$STAGING_SSH_HOST:$DEPLOY_PATH/kickstart/"
      
      rm -rf kickstart-processed /tmp/*.env
      echo "=== Staging deployment complete ==="
  environment:
    name: staging
    url: http://$STAGING_SSH_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  needs:
    - ipxe-lint
    - kickstart-lint

