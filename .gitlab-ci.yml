stages:
  - lint
  - deploy

variables:
  DEPLOY_PATH: "F:/wwwroot"

.ssh_setup: &ssh_setup
  - chmod +x scripts/*.sh
  - source scripts/setup_ssh.sh

ipxe-lint:
  stage: lint
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends > /dev/null 2>&1
  script:
    - chmod +x scripts/lint_ipxe.sh
    - ./scripts/lint_ipxe.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

kickstart-lint:
  stage: lint
  image: fedora:latest
  before_script:
    - dnf install -y pykickstart > /dev/null 2>&1
  script:
    - chmod +x scripts/lint_kickstart.sh
    - ./scripts/lint_kickstart.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

deploy-staging:
  stage: deploy
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache openssh-client gettext openssl
    - *ssh_setup
    - export SSH_HOST="$STAGING_SSH_HOST"
    - export SSH_USER="$STAGING_SSH_USER"
    - export SSH_KEY="$STAGING_SSH_KEY"
  script:
    - export SSH_HOST="$STAGING_SSH_HOST"
    - export SSH_USER="$STAGING_SSH_USER"
    - export SSH_KEY="$STAGING_SSH_KEY"
    - source scripts/setup_ssh.sh "$SSH_HOST" "$SSH_USER" "$SSH_KEY"
    - source scripts/deploy.sh
  environment:
    name: staging
    url: http://$STAGING_SSH_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  needs:
    - ipxe-lint
    - kickstart-lint

deploy-production:
  stage: deploy
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache openssh-client gettext openssl
  script:
    - export SSH_HOST="$PROD_SSH_HOST"
    - export SSH_USER="$PROD_SSH_USER"
    - export SSH_KEY="$PROD_SSH_KEY"
    - source scripts/setup_ssh.sh "$SSH_HOST" "$SSH_USER" "$SSH_KEY"
    - source scripts/deploy.sh
  environment:
    name: production
    url: http://$PROD_SSH_HOST
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - ipxe-lint
    - kickstart-lint

download-fedora-iso:
  stage: deploy
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends wget curl openssh-client p7zip-full > /dev/null 2>&1
  script:
    - chmod +x scripts/download_fedora.sh
    - export SSH_HOST="$PROD_SSH_HOST"
    - export SSH_USER="$PROD_SSH_USER"
    - export SSH_KEY="$PROD_SSH_KEY"
    - source scripts/setup_ssh.sh "$SSH_HOST" "$SSH_USER" "$SSH_KEY"
    - ./scripts/download_fedora.sh
  environment:
    name: production
    url: http://$PROD_SSH_HOST
  rules:
    - if: $FEDORA_DOWNLOAD == "true"
  when: manual

build-ipxe:
  stage: deploy
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y build-essential libssl-dev git openssh-client > /dev/null 2>&1
  script:
    - chmod +x scripts/build_ipxe.sh
    - export SSH_HOST="$PROD_SSH_HOST"
    - export SSH_USER="$PROD_SSH_USER"
    - export SSH_KEY="$PROD_SSH_KEY"
    - source scripts/setup_ssh.sh "$SSH_HOST" "$SSH_USER" "$SSH_KEY"
    - ./scripts/build_ipxe.sh
  environment:
    name: production
    url: http://$PROD_SSH_HOST
  rules:
    - if: $IPXE_BUILD == "true"
  when: manual