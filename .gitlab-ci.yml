download-fedora-iso:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client wget squashfs-tools
  script:
    - |
      echo "=== Downloading Fedora 44 Workstation ISO ==="
      
      # Verify SSH credentials
      if [ -z "$PROD_SSH_HOST" ] || [ -z "$PROD_SSH_USER" ]; then
        echo "ERROR: SSH credentials not configured"
        exit 1
      fi
      
      # Set up SSH key
      if [ -n "$PROD_SSH_KEY" ]; then
        mkdir -p ~/.ssh
        echo "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        echo "Host production
          HostName $PROD_SSH_HOST
          User $PROD_SSH_USER
          IdentityFile ~/.ssh/id_ed25519
          StrictHostKeyChecking accept-new" > ~/.ssh/config
      fi
      
      # Determine Fedora version and download
      FEDORA_VERSION=${FEDORA_VERSION:-44}
      ISO_NAME="Fedora-Workstation-Live-x86_64-${FEDORA_VERSION}-1.2.0.iso"
      ISO_URL="https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_VERSION}/Workstation/x86_64/iso/${ISO_NAME}"
      
      echo "Downloading Fedora $FEDORA_VERSION..."
      wget -q --show-progress -O "${ISO_NAME}" "${ISO_URL}" || {
        echo "ISO download failed, trying latest..."
        # Try to find the latest ISO
        LATEST_URL=$(wget -q -O- "https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_VERSION}/Workstation/x86_64/iso/" | grep -oP 'Fedora-Workstation-Live-x86_64-[0-9.]+\.iso' | head -1)
        if [ -n "$LATEST_URL" ]; then
          wget -q --show-progress -O "fedora-live.iso" "https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_VERSION}/Workstation/x86_64/iso/${LATEST_URL}"
          ISO_NAME="fedora-live.iso"
        else
          echo "Could not find latest ISO"
          exit 1
        fi
      }
      
      echo "ISO downloaded successfully"
      
      # Create mount point and extract ISO
      echo "Extracting ISO contents..."
      mkdir -p iso_mount fedora_extract
      
      mount -o loop,ro "${ISO_NAME}" iso_mount/
      cp -r iso_mount/* fedora_extract/
      
      # Move kernel and initrd to proper location
      mkdir -p fedora_extract/boot/images/pxeboot
      cp fedora_extract/images/pxeboot/vmlinuz fedora_extract/boot/images/pxeboot/ 2>/dev/null || true
      cp fedora_extract/images/pxeboot/initrd.img fedora_extract/boot/images/pxeboot/ 2>/dev/null || true
      
      umount iso_mount
      
      echo "Deploying to IIS server..."
      # Create versioned directory
      ssh -o StrictHostKeyChecking=no "$PROD_SSH_USER@$PROD_SSH_HOST" "mkdir -p $DEPLOY_PATH/fedora/${FEDORA_VERSION}/x86_64/iso"
      
      # Upload extracted ISO content
      scp -o StrictHostKeyChecking=no -r fedora_extract/ "$PROD_SSH_USER@$PROD_SSH_HOST:$DEPLOY_PATH/fedora/${FEDORA_VERSION}/x86_64/iso/"
      
      # Create symlink for "latest"
      ssh -o StrictHostKeyChecking=no "$PROD_SSH_USER@$PROD_SSH_HOST" "ln -sfn ${FEDORA_VERSION} $DEPLOY_PATH/fedora/latest"
      
      # Cleanup
      rm -rf "${ISO_NAME}" iso_mount fedora_extract
      
      echo "=== Fedora ISO deployed successfully ==="
      echo "URL: http://$PROD_SSH_HOST/fedora/${FEDORA_VERSION}/x86_64/iso/"
  environment:
    name: production
    url: http://$PROD_SSH_HOST
  rules:
    - if: $FEDORA_DOWNLOAD == "true"
  when: manual